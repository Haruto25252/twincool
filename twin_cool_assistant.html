<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TWIN COOL assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#1a1d26;--bg2:#22263a;--bg3:#2a2f42;--text:#e8e8f0;--text2:#9999aa;--text3:#555566;--border:#333350;--border2:#44446a;}
body{background:var(--bg);font-family:system-ui,sans-serif;color:var(--text);min-height:100vh;padding:16px;}
.app{max-width:480px;margin:0 auto;position:relative;}
.sl{font-size:11px;font-weight:500;color:var(--text2);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;}
.dv{height:0.5px;background:var(--border);margin:14px 0;}
.card-grid{display:grid;grid-template-columns:28px repeat(10,1fr);gap:3px;align-items:center;width:100%;}
.gh{font-size:11px;font-weight:500;color:var(--text2);text-align:center;height:28px;display:flex;align-items:center;justify-content:center;}
.ic{width:28px;height:36px;display:flex;align-items:center;justify-content:center;}
.cell{height:36px;border-radius:6px;border:0.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;cursor:pointer;user-select:none;transition:opacity .15s;}
.cell.removed{opacity:.1;}
.space-slot{width:80px;height:100px;border-radius:12px;border:1.5px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg2);}
.space-slot.has-card{border-style:solid;}
.hand-card{width:58px;height:76px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;transition:transform .1s;}
.hand-card:active{transform:scale(0.95);}
.btn{padding:8px 14px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);font-size:13px;cursor:pointer;}
.btn-p{background:#2a5fa8;color:white;border-color:#1d4a8a;}
.sug{padding:10px 12px;border-radius:10px;border:0.5px solid var(--border);margin-bottom:6px;cursor:pointer;background:var(--bg2);}
.pb-wrap{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:5px;}
.pb{height:100%;border-radius:3px;}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20;}
.md{background:var(--bg2);border-radius:14px;border:0.5px solid var(--border2);padding:18px;width:280px;}
.cb{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
.cb.sel{border-color:#e8e8f0;}
.nb{width:36px;height:36px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.nb.sel{background:#2a5fa8;color:white;border-color:#1d4a8a;}
.nb.dis{opacity:.3;cursor:default;}
@keyframes flash{0%,100%{opacity:1}40%{opacity:0.05}}
.warn-flash{animation:flash 0.35s ease 4;color:#ff6b6b;font-size:12px;text-align:center;margin-bottom:10px;font-weight:500;}
@keyframes modePulse{0%,100%{opacity:1}50%{opacity:0.25}}
.mode-diff{animation:modePulse 0.8s ease-in-out infinite;}
.cell.in-hand{opacity:.42;cursor:default;}
@keyframes tutPulse{0%,100%{box-shadow:0 0 0 0 rgba(74,154,42,.9)}65%{box-shadow:0 0 0 8px rgba(74,154,42,0)}}
.tut-hl{animation:tutPulse 1.4s ease-out infinite;outline:2.5px solid #4a9a2a;outline-offset:3px;border-radius:6px;}
#tut-tip{position:fixed;z-index:90;background:#0e1e0e;border:1.5px solid #3a7a3a;border-radius:13px;padding:14px 15px;width:238px;max-width:calc(100vw - 16px);box-shadow:0 8px 32px rgba(0,0,0,.85);font-size:12.5px;line-height:1.65;color:var(--text);display:none;}
.tut-tri{width:0;height:0;position:absolute;left:50%;transform:translateX(-50%);}
.tut-tri.up{border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:9px solid #3a7a3a;top:-10px;}
.tut-tri.down{border-left:9px solid transparent;border-right:9px solid transparent;border-top:9px solid #3a7a3a;bottom:-10px;}
#tut-mini{position:fixed;bottom:16px;right:12px;z-index:90;display:none;}
#tut-mini button{background:#0e1e0e;border:1.5px solid #3a7a3a;border-radius:20px;padding:8px 14px;font-size:12px;color:#7acc7a;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.65);}
</style>
</head>
<body>
<div class="app" id="app">
<div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;">
  <span style="font-size:16px;font-weight:600;">TWIN COOL Assistant</span>
  <button onclick="startTutorial()" title="使い方" style="font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;">?</button>
  <div id="play-bar" style="margin-left:auto;"></div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
  <div style="display:flex;align-items:center;gap:6px;">
    <div style="text-align:center;">
      <div style="font-size:9px;color:var(--text2);">除外</div>
      <div style="font-size:18px;font-weight:500;line-height:1;" id="rc">0</div>
    </div>
    <div style="color:var(--text3);font-size:14px;">/</div>
    <div style="text-align:center;">
      <div style="font-size:9px;color:var(--text2);">残り</div>
      <div style="font-size:18px;font-weight:500;line-height:1;" id="rem">80</div>
    </div>
    <div style="color:var(--text3);font-size:14px;">/</div>
    <div style="text-align:center;">
      <div style="font-size:9px;color:var(--text2);">出した枚数</div>
      <div style="font-size:18px;font-weight:500;line-height:1;" id="played-ct">0</div>
    </div>
  </div>
  <div style="display:flex;gap:5px;align-items:center;">
    <button class="btn" style="font-size:11px;padding:5px 8px;" onclick="copyState()" title="現在の状態をコードとしてコピー">状態コピー</button>
    <button class="btn" style="font-size:11px;padding:5px 8px;" onclick="loadState()" title="状態コードを貼り付けて復元">読込</button>
    <button class="btn" style="font-size:11px;padding:5px 9px;" onclick="resetAll()">リセット</button>
  </div>
</div>
<div style="margin-bottom:14px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <div class="sl" style="margin-bottom:0;">カード残存表 <span id="grid-sub" style="font-weight:400;font-size:10px;color:var(--text3);">— タップで除外/復活</span></div>
    <button class="btn" id="lock-btn" style="font-size:12px;padding:5px 9px;opacity:0.4;" onclick="toggleGridLock()" disabled>🔒 ロック</button>
  </div>
  <div class="card-grid" id="grid"></div>
</div>
<div class="dv"></div>
<div style="margin-bottom:14px;">
  <div class="sl">フリースペース</div>
  <div style="display:flex;gap:12px;align-items:flex-start;">
    <div style="text-align:center;">
      <div style="font-size:10px;color:var(--text2);margin-bottom:4px;">SP1</div>
      <div class="space-slot" id="sp1" onclick="openModal('space',0)"></div>
      <button id="sp-clear-0" class="btn" style="font-size:11px;padding:5px 0;margin-top:5px;width:80px;" onclick="clearSpace(0)">クリア</button>
    </div>
    <div style="text-align:center;">
      <div style="font-size:10px;color:var(--text2);margin-bottom:4px;">SP2</div>
      <div class="space-slot" id="sp2" onclick="openModal('space',1)"></div>
      <button id="sp-clear-1" class="btn" style="font-size:11px;padding:5px 0;margin-top:5px;width:80px;" onclick="clearSpace(1)">クリア</button>
    </div>
    <div style="flex:1;padding-left:6px;">
      <div style="font-size:10px;color:var(--text2);margin-bottom:6px;">出せるカード</div>
      <div id="hint" style="font-size:12px;color:var(--text2);line-height:2;"></div>
    </div>
  </div>
</div>
<div class="dv"></div>
<div style="margin-bottom:14px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <div class="sl">手札 <span id="hc" style="font-weight:400;">(0/5)</span></div>
    <button class="btn btn-p" id="add-btn" style="font-size:13px;padding:8px 14px;" onclick="openModal('hand',null)">+ 追加</button>
  </div>
  <div id="hand-area" style="display:flex;gap:8px;flex-wrap:wrap;min-height:80px;align-items:flex-start;">
    <span style="font-size:12px;color:var(--text3);padding-top:28px;">追加ボタンで手札を入力</span>
  </div>
</div>
<div class="dv"></div>
<div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <div class="sl" style="margin-bottom:0;">提案</div>
    <div id="mode-row" style="display:flex;gap:4px;align-items:center;">
      <span style="font-size:10px;color:var(--text2);">目標:</span>
      <button class="btn" id="mode60" style="font-size:11px;padding:5px 8px;" onclick="setMode(60)">60枚</button>
      <button class="btn" id="mode70" style="font-size:11px;padding:5px 8px;" onclick="setMode(70)">70枚</button>
      <button class="btn" id="modeChain" style="font-size:11px;padding:5px 8px;" onclick="setMode('chain')">連鎖</button>
    </div>
  </div>
  <div id="sugs"><span style="font-size:12px;color:var(--text3);">手札を入力すると提案が表示されます</span></div>
</div>
<div class="dv"></div>
<div style="margin-bottom:14px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <div class="sl" style="margin-bottom:0;">クリア確率シミュレーション</div>
    <div style="display:flex;gap:4px;align-items:center;">
      <span style="font-size:10px;color:var(--text2);">試行:</span>
      <button class="btn" id="sim-t1" style="font-size:11px;padding:4px 7px;" onclick="setSimTrials(1000)">1k</button>
      <button class="btn" id="sim-t2" style="font-size:11px;padding:4px 7px;" onclick="setSimTrials(5000)">5k</button>
      <button class="btn" id="sim-t3" style="font-size:11px;padding:4px 7px;" onclick="setSimTrials(10000)">10k</button>
      <button class="btn" id="sim-btn" style="font-size:12px;padding:5px 10px;margin-left:4px;" onclick="startSimulation()">実行</button>
    </div>
  </div>
  <div id="sim-result" style="font-size:12px;color:var(--text3);">手札・SPを設定してから実行してください</div>
  <div id="sim-routes" style="margin-top:10px;"></div>
</div>
<div style="margin-top:32px;padding:18px 0 8px;border-top:0.5px solid var(--border);text-align:center;">
  <div style="display:flex;justify-content:center;gap:20px;margin-bottom:12px;">
    <a href="https://github.com/Haruto25252/twincool" target="_blank" rel="noopener" style="color:var(--text3);text-decoration:none;transition:color .15s;" onmouseover="this.style.color='var(--text2)'" onmouseout="this.style.color='var(--text3)'">
      <svg height="24" viewBox="0 0 16 16" width="24" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
  <div style="font-size:10px;letter-spacing:.12em;color:var(--text3);margin-bottom:5px;">VERSION&nbsp;&nbsp;V1.0.1</div>
  <div style="font-size:10px;letter-spacing:.06em;color:var(--text3);">© 2026&nbsp;&nbsp;Produced by Harun</div>
</div>
<div id="modal-root"></div>
<div id="tut-tip">
  <div class="tut-tri up" id="tut-tri"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span id="tut-counter" style="font-size:11px;color:var(--text3);"></span>
    <button onclick="minimizeTut()" title="最小化" style="background:none;border:1px solid #3a7a3a;border-radius:4px;color:#7acc7a;cursor:pointer;font-size:13px;line-height:1;padding:1px 7px;">−</button>
  </div>
  <div id="tut-msg" style="margin-bottom:10px;"></div>
  <div style="display:flex;justify-content:flex-end;gap:7px;">
    <button class="btn" style="font-size:11px;padding:4px 10px;" onclick="closeTut()">閉じる</button>
    <button class="btn btn-p" id="tut-next" style="font-size:11px;padding:4px 10px;" onclick="tutNext()">次へ →</button>
  </div>
</div>
<div id="tut-mini"><button onclick="expandTut()">チュートリアルを開く</button></div>
</div>
<script>
const COLORS=[
  {name:'赤',hex:'#E24B4A'},{name:'青',hex:'#378ADD'},
  {name:'緑',hex:'#2B9A4A'},{name:'黄',hex:'#EF9F27'},
  {name:'灰',hex:'#A0A09A'},{name:'シアン',hex:'#29B8C2'},
  {name:'紫',hex:'#7F77DD'},{name:'ピンク',hex:'#D4537E'},
];
let removed={},spaces=[null,null],hand=[],gridLocked=false,gameMode=60,playMode=false,prePlayState=null,prePlayLocked=false,playedCount=0,playSaveState=null;
let selColors=[],selNums=[],modalMode=null,modalTarget=null,showWarn=false;
let simTrials=1000;
const isRem=(c,n)=>!!removed[c+'_'+n];
const countCombos=(colors,nums)=>{let c=0;for(const cl of colors)for(const n of nums)if(!isRem(cl,n))c++;return c;};
const togRem=(c,n)=>{if(gridLocked)return;const k=c+'_'+n;removed[k]?delete removed[k]:(removed[k]=true);renderGrid();updateSugs();updateHint();};
function dot(hex,s=14){return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><circle cx="${s/2}" cy="${s/2}" r="${s/2-0.5}" fill="${hex}"/></svg>`;}
function updateCounts(){
  const rc=Object.keys(removed).length;
  document.getElementById('rc').textContent=rc;
  const sc=spaces.filter(s=>s!==null&&!isRem(s.color,s.number)).length;
  document.getElementById('rem').textContent=Math.max(0,80-rc-sc);
  const pc=document.getElementById('played-ct');
  if(pc)pc.textContent=Math.max(0,Object.keys(removed).length-10);
}
function updateLockButton(){
  const btn=document.getElementById('lock-btn');
  const sub=document.getElementById('grid-sub');
  if(!btn) return;
  const rc=Object.keys(removed).length;
  if(gridLocked){
    btn.textContent='🔓 解除';
    btn.disabled=false;
    btn.style.cssText='font-size:12px;padding:5px 9px;opacity:1;background:#6a2a8a;border-color:#4a1a6a;color:white;';
    if(sub) sub.textContent='— ロック中';
  } else {
    btn.textContent='🔒 ロック';
    const canLock=rc>=10;
    btn.disabled=!canLock;
    if(canLock){
      btn.style.cssText='font-size:12px;padding:5px 9px;opacity:1;background:#2a5fa8;border-color:#1d4a8a;color:white;';
    } else {
      btn.style.cssText='font-size:12px;padding:5px 9px;opacity:0.4;';
    }
    if(sub) sub.textContent='— タップで除外/復活';
  }
}
function toggleGridLock(){gridLocked=!gridLocked;renderGrid();}
function renderGrid(){
  const el=document.getElementById('grid');
  let h='<div class="ic"></div>';
  for(let n=1;n<=10;n++) h+=`<div class="gh">${n}</div>`;
  COLORS.forEach(c=>{
    h+=`<div class="ic">${dot(c.hex,18)}</div>`;
    for(let n=1;n<=10;n++){
      const rem=isRem(c.name,n);
      const onSP=!rem&&spaces.some(s=>s&&s.color===c.name&&s.number===n);
      const inHand=!rem&&!onSP&&hand.some(hc=>hc.color===c.name&&hc.number===n);
      const cls='cell'+((rem||onSP)?' removed':inHand?' in-hand':'');
      const noClick=gridLocked||inHand||onSP;
      h+=`<div class="${cls}" style="background:${(rem||onSP)?'var(--bg3)':c.hex+'2a'};color:${(rem||onSP)?'var(--text3)':c.hex};${noClick?'cursor:default;':''}" ${noClick?'':'onclick="togRem(\''+c.name+'\','+n+')"'}>${n}</div>`;
    }
  });
  el.innerHTML=h;
  updateCounts();
  updateLockButton();
}
function renderSpaces(){
  [0,1].forEach(i=>{
    const el=document.getElementById(`sp${i+1}`),card=spaces[i];
    if(card){
      const c=COLORS.find(x=>x.name===card.color);
      el.classList.add('has-card');
      el.style.cssText=`border-color:${c.hex};background:${c.hex}22;border-style:solid;`;
      el.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:5px;"><span style="font-size:24px;font-weight:500;color:white;">${card.number}</span>${dot(c.hex,18)}<span style="font-size:10px;color:rgba(255,255,255,.7);">${card.color}</span></div>`;
    } else {
      el.classList.remove('has-card');el.style.cssText='';
      el.innerHTML=`<span style="font-size:11px;color:var(--text3);text-align:center;line-height:1.7;">タップして<br>設定</span>`;
    }
    const cb=document.getElementById(`sp-clear-${i}`);
    if(cb)cb.style.display=playMode?'none':'block';
  });
  updateHint();updateSugs();
}
function clearSpace(i){spaces[i]=null;renderSpaces();}
function renderHand(){
  const el=document.getElementById('hand-area');
  document.getElementById('hc').textContent=`(${hand.length}/5)`;
  if(!hand.length){el.innerHTML='<span style="font-size:12px;color:var(--text3);padding-top:28px;">追加ボタンで手札を入力</span>';renderGrid();updateSugs();updateHint();updateCounts();return;}
  el.innerHTML=hand.map((card,i)=>{
    const c=COLORS.find(x=>x.name===card.color);
    const delLabel=playMode?'':`<span style="font-size:9px;color:rgba(255,255,255,.6);">×削除</span>`;
    const click=playMode?'':`onclick="removeHand(${i})"`;
    const cursor=playMode?'cursor:default;':'';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;"><div class="hand-card" style="background:${c.hex};${cursor}" ${click}><span style="font-size:20px;font-weight:500;color:white;">${card.number}</span>${dot('#ffffff',14)}${delLabel}</div></div>`;
  }).join('');
  renderGrid();updateSugs();updateHint();updateCounts();
  const ab=document.getElementById('add-btn');
  if(ab){if(hand.length>=5){ab.className='btn';ab.style.cssText='font-size:13px;padding:8px 14px;opacity:0.4;cursor:not-allowed;';}else{ab.className='btn btn-p';ab.style.cssText='font-size:13px;padding:8px 14px;';}}
}
function removeHand(i){hand.splice(i,1);renderHand();}
function updateHint(){
  const el=document.getElementById('hint');
  if(!hand.length){el.textContent='手札を入力すると表示';return;}
  el.innerHTML=[0,1].map(si=>{
    const sp=spaces[si],ok=hand.filter(c=>!sp||c.color===sp.color||c.number===sp.number);
    if(!sp) return `<div>SP${si+1}: 何でも可</div>`;
    if(!ok.length) return `<div style="color:#E24B4A;">SP${si+1}: 出せるカードなし</div>`;
    return `<div>SP${si+1}: ${ok.map(c=>c.color+c.number).join(' ')}</div>`;
  }).join('');
}
function getDeckCards(){
  const d=[];
  for(const c of COLORS)for(let n=1;n<=10;n++){
    if(isRem(c.name,n))continue;
    if(hand.some(h=>h.color===c.name&&h.number===n))continue;
    if(spaces.some(s=>s&&s.color===c.name&&s.number===n))continue;
    d.push({color:c.name,number:n});
  }
  return d;
}
// 連鎖モード用：最大連鎖数 + 終了SP状態を返す（終了時は残デッキ密度が高い色優先）
function maxHandChainFull(hc,sps,cRem){
  if(!hc.length)return{depth:0,es0:sps[0],es1:sps[1]};
  const n=hc.length,memo=new Map(),sk=s=>s?s.color+s.number:'X';
  const dens=(s0,s1)=>(s0?cRem[s0.color]||0:80)+(s1?cRem[s1.color]||0:80);
  function better(a,b){return a.depth!==b.depth?a.depth>b.depth:dens(a.es0,a.es1)>dens(b.es0,b.es1);}
  function dfs(mask,s0,s1){
    const k=mask+'|'+sk(s0)+'|'+sk(s1);
    if(memo.has(k))return memo.get(k);
    let best={depth:0,es0:s0,es1:s1};
    for(let i=0;i<n;i++){
      if(mask&(1<<i))continue;
      const c=hc[i];
      if(!s0||c.color===s0.color||c.number===s0.number){
        const r=dfs(mask|(1<<i),c,s1);
        const cand={depth:1+r.depth,es0:r.es0,es1:r.es1};
        if(better(cand,best))best=cand;
      }
      if(!s1||c.color===s1.color||c.number===s1.number){
        const r=dfs(mask|(1<<i),s0,c);
        const cand={depth:1+r.depth,es0:r.es0,es1:r.es1};
        if(better(cand,best))best=cand;
      }
    }
    memo.set(k,best);return best;
  }

function maxHandChain(hc,sps){
  if(!hc.length)return 0;
  const n=hc.length,memo=new Map(),sk=s=>s?s.color+s.number:'X';
  function dfs(mask,s0,s1){
    const k=mask+'|'+sk(s0)+'|'+sk(s1);
    if(memo.has(k))return memo.get(k);
    let best=0;
    for(let i=0;i<n;i++){
      if(mask&(1<<i))continue;
      const c=hc[i];
      if(!s0||c.color===s0.color||c.number===s0.number)best=Math.max(best,1+dfs(mask|(1<<i),c,s1));
      if(!s1||c.color===s1.color||c.number===s1.number)best=Math.max(best,1+dfs(mask|(1<<i),s0,c));
    }
    memo.set(k,best);return best;
  }
  return dfs(0,sps[0],sps[1]);
}
function calcSugs(){
  const cp=(c,s)=>!s||c.color===s.color||c.number===s.number;
  const deck=getDeckCards();
  const cRem={},nRem={};
  COLORS.forEach(c=>cRem[c.name]=0);
  for(let n=1;n<=10;n++)nRem[n]=0;
  deck.forEach(c=>{cRem[c.color]++;nRem[c.number]++;});
  const s=[];
  hand.forEach((card,ci)=>{
    [0,1].forEach(si=>{
      const sp=spaces[si];
      if(!cp(card,sp))return;
      const ns=[si===0?card:spaces[0],si===1?card:spaces[1]];
      const nh=hand.filter((_,j)=>j!==ci);
      let reason='',base=0;
      if(!sp){base=8;reason='空きスペース';}
      else if(card.color===sp.color&&card.number===sp.number){base=25;reason='完全一致';}
      else if(card.color===sp.color){base=15;reason='同色';}
      else{base=10;reason='同数字';}
      if(gameMode==='chain'){
        // 連鎖モード：手札の最大連鎖 + 終了SP色（残デッキ多い方）を優先
        // デッキ先読みや詰まりリスクは計算しない
        const cf=maxHandChainFull(nh,ns,cRem);
        const endDens=(cf.es0?cRem[cf.es0.color]||0:80)+(cf.es1?cRem[cf.es1.color]||0:80);
        const score=50+base+cf.depth*20+Math.round(endDens/20*10);
        s.push({ci,card,si,score,reason,chain:cf.depth,
                hPlay:nh.filter(c=>ns.some(n2=>cp(c,n2))).length,
                dPlay:0,dTot:0,dRatio:0,contEst:cf.depth+1,
                noHP:false,lowD:false,ns,d2Best:0,cf});
      } else {
        // 60/70枚モード：継続期待枚数・デッキ先読みベース
        const hPlay=nh.filter(c=>ns.some(ns2=>cp(c,ns2))).length;
        const dPlay=deck.filter(c=>ns.some(ns2=>cp(c,ns2))).length;
        const dTot=deck.length;
        const dRatio=dTot>0?dPlay/dTot:0;
        const chain=maxHandChain(nh,ns);
        const noHP=nh.length>0&&hPlay===0;
        const lowD=dRatio<0.15&&dTot>5;
        const contEst=chain+dPlay;
        const s0=ns[0],s1=ns[1];
        let deckDens=0;
        if(s0)deckDens+=cRem[s0.color]||0;
        if(s1)deckDens+=cRem[s1.color]||0;
        const deckDensScore=Math.round(deckDens/20*15);
        let d2Best=dPlay;
        if(nh.length>0){
          nh.forEach(c2=>{
            [0,1].forEach(si2=>{
              if(!cp(c2,ns[si2]))return;
              const ns2=[si2===0?c2:ns[0],si2===1?c2:ns[1]];
              const d2=deck.filter(dc=>ns2.some(s2=>cp(dc,s2))).length;
              if(d2>d2Best)d2Best=d2;
            });
          });
        }
        const d2Ratio=dTot>0?d2Best/dTot:0;
        // base: 完全一致の過大評価を抑制（25→10, 15→9, 10→8, 空き→6）
        const baseTrim=base===25?10:base===15?9:base===10?8:6;
        let score=50+baseTrim+chain*10+deckDensScore+Math.round(dRatio*25)+Math.round(d2Ratio*10);
        if(noHP)score-=25;
        if(lowD)score-=15;
        if(gameMode===70){if(noHP)score-=15;if(lowD)score-=10;}
        score=Math.max(0,score);
        s.push({ci,card,si,score,reason,chain,hPlay,dPlay,dTot,dRatio,contEst,noHP,lowD,ns,d2Best});
      }
    });
  });
  s.sort((a,b)=>{
    if(a.noHP!==b.noHP)return a.noHP?1:-1; // 手詰まりは常に最後
    return b.contEst-a.contEst||b.score-a.score||b.chain-a.chain||b.dPlay-a.dPlay;
  });
  const tot=s.reduce((t,x)=>t+x.score,0)||1;
  s.forEach(x=>x.prob=x.score/tot);
  return s;
}

let simRunning=false,simRunner=null;
function makeRunner(){
  const initDeck=getDeckCards();
  const initHand=hand.map(c=>({...c}));
  const initSp=spaces.map(s=>s?{...s}:null);
  const alreadyPlayed=Object.keys(removed).length+spaces.filter(s=>s&&!isRem(s.color,s.number)).length;
  const noSP=initSp.every(s=>!s);
  const cp=(c,s)=>!s||c.color===s.color||c.number===s.number;
  function run(recordRoute=false){
    const h=initHand.map(c=>({...c}));
    const sp=initSp.map(s=>s?{...s}:null);
    const deck=initDeck.map(c=>({...c}));
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=deck[i];deck[i]=deck[j];deck[j]=t;}
    let played=0;const route=recordRoute?[]:null;
    for(;;){
      const moves=[];
      for(let ci=0;ci<h.length;ci++)for(let si=0;si<2;si++)if(cp(h[ci],sp[si]))moves.push(ci*2+si);
      if(!moves.length)break;
      const mv=moves[Math.floor(Math.random()*moves.length)];
      const ci=mv>>1,si=mv&1;
      const card={...h[ci]};
      sp[si]=h[ci];h.splice(ci,1);played++;
      const drawn=deck.length>0?{...deck.pop()}:null;
      if(route)route.push({card,si,drawn});
      if(alreadyPlayed+played>=70)break;
      if(drawn)h.push(drawn);
    }
    const total=alreadyPlayed+played;
    return{win60:total>=60,win70:total>=70,route};
  }
  return{run,alreadyPlayed,noSP};
}

function startSimulation(){

  const TRIALS=simTrials,BATCH=100;

  function nextBatch(){
    const end=Math.min(done+BATCH,TRIALS);
    while(done<end){const r=simRunner.run();if(r.win60)pass60++;if(r.win70)pass70++;done++;}
    if(done<TRIALS){
      el.innerHTML=`<span style="color:var(--text2);">計算中... ${done} / ${TRIALS}</span>`;
      setTimeout(nextBatch,0);
    }else{
      simRunning=false;btn.disabled=false;btn.style.opacity='1';
      const p60=Math.round(pass60/TRIALS*100),p70=Math.round(pass70/TRIALS*100);
      const col=(p)=>p>=70?'#4a9a2a':p>=40?'#c8850a':'#c03030';
      const spNote=simRunner.noSP?'<span style="color:var(--text3);"> ・SP未設定=何でも出せる扱い</span>':'';
      el.innerHTML=`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:5px;">
        <div style="display:flex;align-items:baseline;gap:4px;"><span style="font-size:11px;color:var(--text2);">60枚クリア</span><span style="font-size:22px;font-weight:500;color:${col(p60)};">${p60}%</span></div>
        <div style="display:flex;align-items:baseline;gap:4px;"><span style="font-size:11px;color:var(--text2);">70枚クリア</span><span style="font-size:22px;font-weight:500;color:${col(p70)};">${p70}%</span></div>
        <span style="font-size:11px;color:var(--text3);">現在 ${simRunner.alreadyPlayed} 枚消費済み</span>
      </div>
      <div class="pb-wrap"><div class="pb" style="width:${p60}%;background:${col(p60)};"></div></div>
      <div style="font-size:10px;color:var(--text3);margin-top:5px;">※ランダムプレイ基準のため序盤ほど低く出ます。実際の最適プレイでは大幅に高くなります${spNote}</div>`;
      if(rt&&(pass60>0||pass70>0)){rt.innerHTML=`<button class="btn" id="route-btn" style="font-size:12px;padding:6px 12px;margin-top:4px;" onclick="findClearRoutes()">クリアルートを表示</button><div id="route-list" style="margin-top:8px;"></div>`;}
    }
  }
  setTimeout(nextBatch,0);
}
function findClearRoutes(){
  if(!simRunner)return;
  const btn=document.getElementById('route-btn'),rl=document.getElementById('route-list');
  if(!btn||!rl)return;
  btn.disabled=true;btn.textContent='探索中...';rl.innerHTML='';
  const TRIALS=simTrials,BATCH=100;
  let done=0;const byFirst={};
  function nextBatch(){
    const end=Math.min(done+BATCH,TRIALS);
    while(done<end){
      const r=simRunner.run(true);
      const route=r.route;
      if(route&&route.length>0){
        const f=route[0],key=f.card.color+f.card.number+'_'+f.si;
        if(!byFirst[key])byFirst[key]={card:f.card,si:f.si,wins60:0,total:0,ex:null};
        byFirst[key].total++;
        if(r.win60){byFirst[key].wins60++;if(!byFirst[key].ex)byFirst[key].ex=route;}
      }
      done++;
    }
    if(done<TRIALS){
      rl.innerHTML=`<span style="font-size:11px;color:var(--text2);">探索中... ${done}/${TRIALS}</span>`;
      setTimeout(nextBatch,0);
    }else{
      btn.disabled=false;btn.textContent='再探索';
      renderRoutes(byFirst,rl);
    }
  }
  setTimeout(nextBatch,0);
}
function renderRoutes(byFirst,rl){
  const cmap=Object.fromEntries(COLORS.map(c=>[c.name,c.hex]));
  const dd=(col,s=8)=>`<span style="display:inline-block;width:${s}px;height:${s}px;border-radius:50%;background:${cmap[col]||'#888'};margin-right:3px;vertical-align:middle;"></span>`;
  const groups=Object.values(byFirst).filter(g=>g.wins60>0).sort((a,b)=>b.wins60/b.total-a.wins60/a.total);
  if(!groups.length){rl.innerHTML='<div style="font-size:12px;color:var(--text3);">クリアルートが見つかりませんでした（再探索してみてね）</div>';return;}
  rl.innerHTML=`<div style="font-size:11px;color:var(--text2);margin-bottom:8px;">クリアルート ― 先行カード別（${simTrials}試行）</div>`+
  groups.slice(0,6).map((g,gi)=>{
    const pct=Math.round(g.wins60/g.total*100);
    const col=pct>=60?'#4a9a2a':pct>=30?'#c8850a':'#c03030';
    const stepHtml=(step,i)=>{
      const drawnTxt=step.drawn?` <span style="color:var(--text3);">→ ${step.drawn.color}${step.drawn.number}を引く</span>`:'';
      return `<div style="padding:2px 0 2px 8px;font-size:11px;line-height:1.6;border-left:1.5px solid var(--border2);">${i+1}. ${dd(step.card.color)}${step.card.color}${step.card.number} → SP${step.si+1}${drawnTxt}</div>`;
    };
    let steps='';
    if(g.ex){
      steps=g.ex.slice(0,10).map(stepHtml).join('');
      if(g.ex.length>10){
        const extra=g.ex.slice(10).map(stepHtml).join('');
        steps+=`<div id="re-${gi}" style="display:none;">${extra}</div>
        <div style="display:flex;align-items:center;gap:6px;padding-left:8px;margin-top:2px;">
          <span style="font-size:10px;color:var(--text3);">…以降 ${g.ex.length-10} 手</span>
          <button id="re-btn-${gi}" class="btn" style="font-size:10px;padding:2px 8px;" onclick="toggleRouteExtra(${gi})">すべて表示</button>
        </div>`;
      }
    }
    return `<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div style="font-size:12px;font-weight:500;">${dd(g.card.color,10)}先行: ${g.card.color}${g.card.number} → SP${g.si+1}</div>
        <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:18px;font-weight:500;color:${col};">${pct}%</span><span style="font-size:10px;color:var(--text3);">(${g.wins60}/${g.total})</span></div>
      </div>${steps}</div>`;
  }).join('');
}
function toggleRouteExtra(i){
  const el=document.getElementById(`re-${i}`),btn=document.getElementById(`re-btn-${i}`);
  if(!el)return;
  const show=el.style.display==='none';
  el.style.display=show?'block':'none';
  if(btn)btn.textContent=show?'閉じる':'すべて表示';
}
function encodeState(){
  const ci=(col,n)=>COLORS.findIndex(x=>x.name===col)*10+(n-1);
  const bits=[];
  const push=(v,len)=>{for(let i=len-1;i>=0;i--)bits.push((v>>i)&1);};
  push(1,4); // version 1
  for(const c of COLORS)for(let n=1;n<=10;n++)bits.push(isRem(c.name,n)?1:0); // removed: 80 bits
  push(spaces[0]?ci(spaces[0].color,spaces[0].number)+1:0,7); // SP0
  push(spaces[1]?ci(spaces[1].color,spaces[1].number)+1:0,7); // SP1
  push(hand.length,3); // hand length
  for(let i=0;i<5;i++)push(i<hand.length?ci(hand[i].color,hand[i].number):0,7); // hand cards
  push(gameMode===60?0:gameMode===70?1:2,2); // mode
  // bits → BigInt → base62
  let val=0n;for(const b of bits)val=(val<<1n)|BigInt(b);
  const B62='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',b=BigInt(62);
  let s='';for(let i=0;i<24;i++){s=B62[Number(val%b)]+s;val/=b;}
  return s;
}
function decodeState(s){
  try{
    s=s.trim();if(s.length!==24)return false;
    const B62='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ',b=BigInt(62);
    let val=0n;
    for(const ch of s){const d=B62.indexOf(ch);if(d<0)return false;val=val*b+BigInt(d);}
    // BigInt → bits (MSB first)
    const BITS=138,ba=new Array(BITS);
    for(let i=BITS-1;i>=0;i--){ba[i]=Number(val&1n);val>>=1n;}
    let p=0;const rd=(len)=>{let v=0;for(let i=0;i<len;i++)v=(v<<1)|ba[p++];return v;};
    if(rd(4)!==1)return false; // version check
    const nr={};
    for(const c of COLORS)for(let n=1;n<=10;n++){if(rd(1))nr[c.name+'_'+n]=true;}
    const c2card=(v)=>{if(!v)return null;const idx=v-1,ci=Math.floor(idx/10);return ci<COLORS.length?{color:COLORS[ci].name,number:idx%10+1}:null;};
    const sp0=c2card(rd(7)),sp1=c2card(rd(7));
    const hlen=Math.min(rd(3),5);const nh=[];
    for(let i=0;i<5;i++){const v=rd(7);if(i<hlen&&v<COLORS.length*10)nh.push({color:COLORS[Math.floor(v/10)].name,number:v%10+1});}
    const gm=rd(2);const nm=gm===0?60:gm===1?70:'chain';
    removed=nr;spaces=[sp0,sp1];hand=nh;gridLocked=false;
    renderGrid();renderSpaces();renderHand();setMode(nm);
    return true;
  }catch(e){return false;}
}
function showToast(msg,err=false){
  let el=document.getElementById('fb-toast');
  if(!el){el=document.createElement('div');el.id='fb-toast';el.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:100;transition:opacity .4s;pointer-events:none;white-space:nowrap;';document.body.appendChild(el);}
  el.style.cssText=el.style.cssText.replace(/opacity:[^;]+;/,'')+';opacity:1;';
  el.style.background=err?'#3a1a1a':'#1a3a1a';
  el.style.color=err?'#ff8888':'#7acc7a';
  el.style.border=`0.5px solid ${err?'#7a3a3a':'#3a7a3a'}`;
  el.textContent=msg;
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.opacity='0';},2200);
}
function copyState(){
  const h=encodeState();
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=h;ta.style.cssText='position:fixed;top:-9999px;';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('状態コードをコピーしました');}catch(e){showToast('コピー失敗: '+h,true);}document.body.removeChild(ta);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(h).then(()=>showToast('状態コードをコピーしました')).catch(fallback);}else{fallback();}
}
function loadState(){
  const h=window.prompt('状態コードを貼り付けてください:','');
  if(!h||!h.trim())return;
  if(!decodeState(h.trim()))showToast('読込に失敗しました（コードが無効です）',true);
  else showToast('状態を読み込みました');
}
let tutIdx=-1,tutScrollListener=null;
const TUT=[
  {sel:'#grid',
   msg:'<b>① カード除外</b><br>ゲーム開始時に裏向きにされたカードをここでタップして除外してね！除外したカードはほぼ見えなくなるよ（最低10枚除外でロックできる）'},
  {sel:'#lock-btn',
   msg:'<b>② グリッドロック</b><br>10枚以上除外したらここをタップ！ロック中は誤タップを防げるよ。再タップで解除できる'},
  {sel:'#add-btn',
   msg:'<b>③ 手札入力</b><br>今の手札をここから追加してね！色を選んで数字を選んで「カードを追加」でOK。色・数字は複数同時選択もできるよ'},
  {sel:'#sugs',
   msg:'<b>④ 提案カード</b><br>手札を入力するとここに出すべきカードが提案されるよ！一番上が最おすすめ。タップするとそのカードを出したことになる'},
  {sel:'#mode-row',
   msg:'<b>⑤ モード選択</b><br>・<b>60/70枚</b>：目標枚数消費を目指す戦略提案<br>・<b>連鎖</b>：手札から最大連鎖できる手順を提案（デッキ消費は考慮しない）<br><br>モードで推奨が違う場合、そのボタンが点滅するよ！'},
];
function startTutorial(){tutIdx=0;renderTutStep();}
function tutNext(){
  document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));
  tutIdx++;
  if(tutIdx>=TUT.length){closeTut();return;}
  renderTutStep();
}
function closeTut(){
  if(tutScrollListener){window.removeEventListener('scroll',tutScrollListener,{passive:true});tutScrollListener=null;}
  document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));
  const tip=document.getElementById('tut-tip');if(tip)tip.style.display='none';
  tutIdx=-1;
}
function renderTutStep(){
  if(tutScrollListener){window.removeEventListener('scroll',tutScrollListener,{passive:true});tutScrollListener=null;}
  const step=TUT[tutIdx];
  const target=document.querySelector(step.sel);
  if(!target){tutNext();return;}
  document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));
  target.classList.add('tut-hl');
  const tip=document.getElementById('tut-tip');if(!tip)return;
  document.getElementById('tut-msg').innerHTML=step.msg;
  document.getElementById('tut-counter').textContent=`${tutIdx+1} / ${TUT.length}`;
  const nextBtn=document.getElementById('tut-next');
  if(nextBtn)nextBtn.textContent=tutIdx===TUT.length-1?'完了 ✓':'次へ →';
  tip.style.display='block';
  function posTip(ensureVis){
    const r=target.getBoundingClientRect();
    const vw=window.innerWidth,vh=window.innerHeight;
    const tw=238,th=tip.offsetHeight||140;
    const cx=r.left+r.width/2;
    const placeBelow=(r.top>=0&&r.top<vh*0.55)||(r.bottom+th+16<vh);
    const top=placeBelow?r.bottom+12:r.top-th-12;
    const left=Math.min(Math.max(cx-tw/2,8),vw-tw-8);
    const tri=document.getElementById('tut-tri');
    if(tri){
      tri.className='tut-tri '+(placeBelow?'up':'down');
      tri.style.left=Math.min(Math.max(cx-left,16),tw-16)+'px';
      tri.style.transform='none';
    }
    tip.style.top=Math.max(8,top)+'px';
    tip.style.left=left+'px';
    if(ensureVis){
      const tt=parseFloat(tip.style.top),tb=tt+(tip.offsetHeight||th);
      if(tb>vh-8)window.scrollBy({top:tb-vh+24,behavior:'smooth'});
      else if(tt<8)window.scrollBy({top:tt-8,behavior:'smooth'});
    }
  }
  target.scrollIntoView({behavior:'smooth',block:'nearest'});
  setTimeout(()=>posTip(true),350);
  tutScrollListener=()=>posTip(false);
  window.addEventListener('scroll',tutScrollListener,{passive:true});
}
function minimizeTut(){
  if(tutScrollListener){window.removeEventListener('scroll',tutScrollListener,{passive:true});tutScrollListener=null;}
  const tip=document.getElementById('tut-tip'),mini=document.getElementById('tut-mini');
  if(tip)tip.style.display='none';
  if(mini)mini.style.display='block';
}
function expandTut(){
  const mini=document.getElementById('tut-mini');
  if(mini)mini.style.display='none';
  if(tutIdx<0)tutIdx=0;
  renderTutStep();
}
function renderPlayMode(){
  const el=document.getElementById('play-bar');if(!el)return;
  if(playMode){
    const loadDis=!playSaveState;
    el.innerHTML=`<div style="display:flex;align-items:center;gap:4px;">
      <button class="btn" style="font-size:10px;padding:3px 7px;" onclick="saveMidPlay()" title="セーブ">💾</button>
      <button class="btn" style="font-size:10px;padding:3px 7px;${loadDis?'opacity:0.35;cursor:not-allowed;':''}" ${loadDis?'disabled':''} onclick="loadMidPlay()" title="ロード">📂</button>
      <span style="font-size:10px;color:#7acc7a;font-weight:600;">▶ プレイ中</span>
      <button class="btn" style="font-size:10px;padding:3px 8px;" onclick="exitPlayMode()">終了</button>
    </div>`;
  } else {
    el.innerHTML=`<button class="btn" style="font-size:11px;padding:4px 9px;" onclick="startPlay()">▶ プレイ</button>`;
  }
}
function saveMidPlay(){playSaveState=encodeState();renderPlayMode();showToast('セーブしました');}
function loadMidPlay(){
  if(!playSaveState)return;
  decodeState(playSaveState);
  playMode=true;renderPlayMode();renderSpaces();showToast('ロードしました');
}
function randomExclude10(){
  const deck=[];
  for(const c of COLORS)for(let n=1;n<=10;n++)if(!isRem(c.name,n)&&!hand.some(h=>h.color===c.name&&h.number===n)&&!spaces.some(s=>s&&s.color===c.name&&s.number===n))deck.push({color:c.name,number:n});
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=deck[i];deck[i]=deck[j];deck[j]=t;}
  deck.slice(0,Math.min(10,deck.length)).forEach(c=>{removed[c.color+'_'+c.number]=true;});
  gridLocked=true;
  renderGrid();
}
function drawToFive(){
  const need=5-hand.length;if(need<=0)return;
  const deck=getDeckCards();
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=deck[i];deck[i]=deck[j];deck[j]=t;}
  deck.slice(0,Math.min(need,deck.length)).forEach(c=>hand.push({...c}));
  renderHand();
}
function startPlay(){
  prePlayState=encodeState();prePlayLocked=gridLocked;
  if(!gridLocked){
    document.getElementById('modal-root').innerHTML=`<div class="mo" onclick="cbg(event)"><div class="md" onclick="event.stopPropagation()">
      <div style="font-size:13px;line-height:1.7;margin-bottom:18px;">初期カードをランダムに<b>10枚除外</b>しますか？<br><span style="font-size:11px;color:var(--text3);">スキップすると現在の除外状態のまま進みます</span></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" style="flex:1;padding:10px;" onclick="cm();_playStep2()">スキップ</button>
        <button class="btn btn-p" style="flex:1;padding:10px;" onclick="randomExclude10();cm();_playStep2()">はい</button>
      </div>
    </div></div>`;
  } else {
    _playStep2();
  }
}
function _playStep2(){
  const need=5-hand.length;
  if(need>0){
    document.getElementById('modal-root').innerHTML=`<div class="mo" onclick="cbg(event)"><div class="md" onclick="event.stopPropagation()">
      <div style="font-size:13px;line-height:1.7;margin-bottom:18px;">手札が${hand.length}枚です。デッキからランダムに<b>${need}枚補充</b>しますか？</div>
      <div style="display:flex;gap:8px;">
        <button class="btn" style="flex:1;padding:10px;" onclick="cm();enterPlayMode()">スキップ</button>
        <button class="btn btn-p" style="flex:1;padding:10px;" onclick="drawToFive();cm();enterPlayMode()">はい</button>
      </div>
    </div></div>`;
  } else {
    enterPlayMode();
  }
}
function enterPlayMode(){playedCount=0;playMode=true;renderPlayMode();renderSpaces();showToast('プレイ開始！');}
function exitPlayMode(){
  document.getElementById('modal-root').innerHTML=`<div class="mo" onclick="cbg(event)"><div class="md" onclick="event.stopPropagation()">
    <div style="font-size:13px;line-height:1.7;margin-bottom:18px;">プレイ開始時の状態に戻しますか？</div>
    <div style="display:flex;gap:8px;">
      <button class="btn" style="flex:1;padding:10px;" onclick="cm();_doExitPlay(false)">このまま終了</button>
      <button class="btn btn-p" style="flex:1;padding:10px;" onclick="cm();_doExitPlay(true)">開始時に戻す</button>
    </div>
  </div></div>`;
}
function _doExitPlay(restore){
  const saved=prePlayState,savedLocked=prePlayLocked;
  playMode=false;prePlayState=null;prePlayLocked=false;playedCount=0;playSaveState=null;
  if(restore&&saved){decodeState(saved);gridLocked=savedLocked;renderGrid();}
  renderPlayMode();renderSpaces();
}
function confirmRestartPlay(){
  document.getElementById('modal-root').innerHTML=`<div class="mo" onclick="cbg(event)"><div class="md" onclick="event.stopPropagation()">
    <div style="font-size:13px;line-height:1.7;margin-bottom:18px;">プレイをリセットして最初からやり直しますか？</div>
    <div style="display:flex;gap:8px;">
      <button class="btn" style="flex:1;padding:10px;" onclick="cm()">キャンセル</button>
      <button class="btn btn-p" style="flex:1;padding:10px;" onclick="cm();_restartPlay()">最初から</button>
    </div>
  </div></div>`;
}
function _restartPlay(){
  const saved=prePlayState,savedLocked=prePlayLocked;
  playMode=false;prePlayState=null;prePlayLocked=false;playedCount=0;playSaveState=null;
  if(saved){decodeState(saved);gridLocked=savedLocked;renderGrid();}
  renderPlayMode();
  setTimeout(()=>startPlay(),80);
}
function resetAll(){removed={};spaces=[null,null];hand=[];gridLocked=false;playMode=false;prePlayState=null;prePlayLocked=false;playedCount=0;renderGrid();renderSpaces();renderHand();renderPlayMode();}
function setMode(m){
  gameMode=m;
  const b60=document.getElementById('mode60'),b70=document.getElementById('mode70'),bc=document.getElementById('modeChain');
  if(!b60||!b70||!bc)return;
  b60.style.cssText='font-size:11px;padding:5px 8px;'+(m===60?'background:#2a5fa8;color:white;border-color:#1d4a8a;':'');
  b70.style.cssText='font-size:11px;padding:5px 8px;'+(m===70?'background:#7a2a7a;color:white;border-color:#5a1a5a;':'');
  bc.style.cssText='font-size:11px;padding:5px 8px;'+(m==='chain'?'background:#1a6a3a;color:white;border-color:#0a4a2a;':'');
  updateSugs();
}
renderGrid();renderSpaces();renderHand();setMode(60);renderPlayMode();setSimTrials(1000);
